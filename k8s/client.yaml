apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: appointment-system
  labels:
    app: client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: appointment-client:latest # Assume typical client image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: appointment-system
spec:
  selector:
    app: client
  ports:
    - port: 80
      targetPort: 80
