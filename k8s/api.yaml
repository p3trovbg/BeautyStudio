apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: appointment-system
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: appointment-api:latest # Assume an image name here for deployment
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: appointment-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: appointment-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: appointment-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: appointment-secrets
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__DefaultConnection
              value: "Host=postgres;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)"
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: appointment-secrets
                  key: JWT_KEY
            - name: Jwt__Issuer
              valueFrom:
                secretKeyRef:
                  name: appointment-secrets
                  key: JWT_ISSUER
            - name: Jwt__Audience
              valueFrom:
                secretKeyRef:
                  name: appointment-secrets
                  key: JWT_AUDIENCE
            - name: Email__SmtpHost
              valueFrom:
                configMapKeyRef:
                  name: appointment-config
                  key: SMTP_HOST
            - name: Email__SmtpPort
              valueFrom:
                configMapKeyRef:
                  name: appointment-config
                  key: SMTP_PORT
            - name: Email__SmtpUser
              valueFrom:
                secretKeyRef:
                  name: appointment-secrets
                  key: SMTP_USER
            - name: Email__SmtpPassword
              valueFrom:
                secretKeyRef:
                  name: appointment-secrets
                  key: SMTP_PASSWORD
            - name: Email__FromAddress
              valueFrom:
                configMapKeyRef:
                  name: appointment-config
                  key: EMAIL_FROM
            - name: Cors__AllowedOrigins
              valueFrom:
                configMapKeyRef:
                  name: appointment-config
                  key: CORS_ORIGINS
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: appointment-system
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
